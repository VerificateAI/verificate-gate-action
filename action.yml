name: "Verificate Gate"
description: "Merge gate for AI-written code: catches invented APIs, mocks-as-done and reward-gamed tests in PRs. ISO 5055 checks. Free, no signup."
branding: { icon: "shield", color: "green" }
inputs:
  verificate-api-key:
    description: "Optional Verificate token (avoids the free-tier per-runner cap on busy repos)."
    required: false
    default: ""
  fail-on:
    description: "'reject' = fail the check (block merge) on a veto; 'off' = comment only."
    required: false
    default: "reject"
  max-files:
    description: "Max changed code files to review per PR (1-300)."
    required: false
    default: "25"
  mcp-url:
    description: "Verificate MCP endpoint."
    required: false
    default: "https://mcp.verificate.ai/mcp"
  cross-file:
    description: "'auto' = when the repo is checked out, give the gate cross-file guard context so it drops findings a guard in another file already blocks; 'off' = review each file alone."
    required: false
    default: "auto"
outputs:
  verdict:
    description: "Overall gate verdict: 'approved', 'rejected', 'vetoed', or 'error' (gate failures never block merges)."
    value: ${{ steps.gate.outputs.verdict }}
  files_reviewed:
    description: "Number of changed code files reviewed in this pull request."
    value: ${{ steps.gate.outputs.files_reviewed }}
  files_errored:
    description: "Files skipped due to transient gate errors or quota."
    value: ${{ steps.gate.outputs.files_errored }}
  files_dropped:
    description: "Files left unreviewed because the PR exceeded max-files."
    value: ${{ steps.gate.outputs.files_dropped }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.11" }
    - id: gate
      run: python "${{ github.action_path }}/gate.py"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VERIFICATE_API_KEY: ${{ inputs.verificate-api-key }}
        VERIFICATE_MCP_URL: ${{ inputs.mcp-url }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX_FILES: ${{ inputs.max-files }}
        CROSS_FILE: ${{ inputs.cross-file }}
